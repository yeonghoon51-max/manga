# 말풍선 만화 번역기를 GitHub Pages 로 자동 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 주세요.
name: Deploy 말풍선

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js icons manifest.webmanifest sw.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
